services:
  - type: web
    name: resolve-ao-tickets
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: BUSINESS_PHONE
        value: "244931719199"
    # O plano "free" do Render não suporta discos persistentes.
    # Se mudar para um plano pago e quiser que data/tickets.json sobreviva a reinícios,
    # descomente as linhas abaixo:
    # disk:
    #   name: resolve-ao-data
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1
